apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: true
    jsonData:
      version: Flux
      organization: p3-org
      defaultBucket: energy-bucket
      tlsSkipVerify: true
    secureJsonData:
      token: super-secret-token